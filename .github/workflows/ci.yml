name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The pi devDependencies pin the runtime the extension targets (1.1.0, the peer floor too),
  # so `build` above is also the floor check. JW-166 dropped the separate 0.84.x floor job.

  # Forward canary: reinstall whatever Pi is `latest` over the pin, so a release newer than
  # the baseline surfaces here before it reaches users. It runs the full typecheck + suite,
  # not a hand-picked file list, so new drift can't hide in a test nobody remembered to add
  # here. Both steps pass as of the 1.1.0 baseline — a failure IS fresh breakage.
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
